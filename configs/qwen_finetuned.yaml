model:
  path: ./artifacts/trained_models/qwen_finetuned
  dtype: float16
  trust_remote_code: false

backend: vllm

quantization:
  method: none

hardware:
  device: cuda

  # total GPUs on the machine
  num_gpus: 4

  # model parallelism
  tensor_parallel_size: 2

  # pipeline disabled
  pipeline_parallel_size: 1

  # replica count
  data_parallel_size: 2

  schedule: round_robin

  gpu_memory_utilization: 0.9

  admission_fast_threshold_gb: 8.0
  admission_offload_threshold_gb: 3.0

generation:
  max_new_tokens: 2048
  max_model_len: 8192
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1

speculative_decoding:
  enabled: true
  method: ngram
  num_speculative_tokens: 5
  ngram_prompt_lookup_max: 4

server:
  host: 0.0.0.0
  port: 8000
  timeout: 180

logging:
  level: INFO
  file: ./logs/qwen_finetuned.log