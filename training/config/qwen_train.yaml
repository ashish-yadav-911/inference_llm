model:
  name: Qwen/Qwen2-7B-Instruct
  dtype: bfloat16           # bfloat16 recommended for large models (no NaN risk)
                            # use float16 only for pre-Ampere GPUs (V100, P100)

training:
  epochs: 3
  batch_size: 2             # per-GPU micro batch size
  lr: 3e-5
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 4
  max_seq_len: 2048
  grad_clip: 1.0            # gradient clipping max norm

hardware:
  num_gpus: 4


  distributed_backend: deepspeed   # "ddp" or "deepspeed"

  zero_stage: 2

data:
  dataset_path: ./data/train.jsonl
  text_field: text

output:
  save_dir: ./artifacts/trained_models/qwen_finetuned
  save_steps: 500

# ── Memory reference table ────────────────────────────────────────────────────
#
# Model        Params    DDP (bf16)   ZeRO-2 (4 GPU)   ZeRO-3 (4 GPU)
# ─────────────────────────────────────────────────────────────────────
# Qwen2-7B     7B        ~28 GB/GPU   ~14 GB/GPU        ~7 GB/GPU
# Qwen2-14B    14B       ~56 GB/GPU   ~28 GB/GPU        ~14 GB/GPU
# Qwen2-72B    72B       N/A (OOM)    N/A (OOM)         ~36 GB/GPU
#
# Rule of thumb: ZeRO-2 ≈ DDP/2, ZeRO-3 ≈ DDP/N_gpus
# These are rough estimates; actual usage depends on seq_len, batch_size,
# activation memory, and gradient checkpointing.