model:
  name: Qwen/Qwen2-7B-Instruct
  dtype: float16

training:
  epochs: 3
  batch_size: 2
  lr: 3e-5
  weight_decay: 0.01
  warmup_steps: 100
  gradient_accumulation_steps: 4
  max_seq_len: 2048

hardware:
  num_gpus: 4
  backend: nccl

data:
  dataset_path: ./data/train.jsonl
  text_field: text

output:
  save_dir: ./artifacts/trained_models/qwen_finetuned
  save_steps: 500